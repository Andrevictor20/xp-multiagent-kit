name: Trusted Release Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Strict Environment Sanitization
        run: |
          # Ensure no malicious NODE_OPTIONS or PATHs are carried over
          unset NODE_OPTIONS
          unset NODE_PATH
          unset LD_PRELOAD
          unset BASH_ENV
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

      - name: Start Database
        run: docker compose up -d
        working-directory: ./taskboard

      - name: Wait for Database
        run: sleep 5

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: ./taskboard/backend

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./taskboard/frontend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./taskboard/backend

      - name: Push Prisma Schema
        run: npx prisma db push
        working-directory: ./taskboard/backend
        env:
          DATABASE_URL: postgresql://admin:admin@localhost:5432/taskboard?schema=public

      - name: Run Backend Tests
        run: npm run test
        working-directory: ./taskboard/backend
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: postgresql://admin:admin@localhost:5432/taskboard?schema=public

      - name: Run Frontend Tests
        run: npm run test
        working-directory: ./taskboard/frontend
