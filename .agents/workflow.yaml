# .agents/workflow.yaml — Grafo Mínimo e Fluxos de Execução do Kit (AC-7)
version: "4.0.0"

risk_workflows:
  L0: "chore"
  L1: "fix"
  L2: "feature"
  L3: "feature"

workflows:
  feature:
    description: "Ciclo completo de nova funcionalidade com ATDD e EGM"
    nodes:
      - {name: "spec", run: "orchestrator", kind: "model", skills: ["spec-pyramid"], soft_turns: 5, exit_cmd: "python3 scripts/xp contract validate", on_fail: "retry", timeout: 10}
      - {name: "approve_spec", run: "reviewer", kind: "model", skills: ["goldfish-spec-review"], soft_turns: 3, exit_cmd: "test -f .agents/runtime/run.json", on_fail: "retry", timeout: 5}
      - {name: "test_red", run: "builder", kind: "model", skills: ["tdd-safety-net"], soft_turns: 5, exit_cmd: "! {verify_cmd}", on_fail: "retry", timeout: 15, freeze_tests: true}
      - {name: "impl_green", run: "builder", kind: "model", skills: ["tdd-safety-net"], soft_turns: 10, exit_cmd: "{verify_cmd}", on_fail: "retry", timeout: 30}
      - {name: "egm_review", run: "reviewer", kind: "model", skills: ["code-hygiene-review"], soft_turns: 5, exit_cmd: "python3 scripts/xp_gate.py check", on_fail: "retry", timeout: 15}
      - {name: "gate", run: "reviewer", kind: "code", skills: [], soft_turns: 2, exit_cmd: "python3 scripts/xp_gate.py check", on_fail: "abort", timeout: 5}

  fix:
    description: "Correção de defeito reproduzível com teste de regressão RED"
    nodes:
      - {name: "reproduce_red", run: "builder", kind: "model", skills: ["tdd-safety-net"], soft_turns: 5, exit_cmd: "! {verify_cmd}", on_fail: "retry", timeout: 10, freeze_tests: true}
      - {name: "impl_green", run: "builder", kind: "model", skills: ["tdd-safety-net"], soft_turns: 10, exit_cmd: "{verify_cmd}", on_fail: "retry", timeout: 20}
      - {name: "gate", run: "reviewer", kind: "code", skills: ["code-hygiene-review"], soft_turns: 2, exit_cmd: "python3 scripts/xp_gate.py check", on_fail: "abort", timeout: 5}

  refactor:
    description: "Refatoração estrutural sem alteração de comportamento"
    nodes:
      - {name: "baseline_green", run: "builder", kind: "code", skills: ["tdd-safety-net"], soft_turns: 3, exit_cmd: "{verify_cmd}", on_fail: "abort", timeout: 5}
      - {name: "refactor_step", run: "reviewer", kind: "model", skills: ["code-hygiene-review"], soft_turns: 10, exit_cmd: "python3 scripts/kit_lint.py", on_fail: "retry", timeout: 20}
      - {name: "gate", run: "reviewer", kind: "code", skills: [], soft_turns: 2, exit_cmd: "python3 scripts/xp_gate.py check", on_fail: "abort", timeout: 5}

  chore:
    description: "Manutenção, atualização de dependências e lint"
    nodes:
      - {name: "lint_check", run: "builder", kind: "code", skills: ["code-hygiene-review"], soft_turns: 5, exit_cmd: "python3 scripts/kit_lint.py", on_fail: "retry", timeout: 10}
      - {name: "gate", run: "reviewer", kind: "code", skills: [], soft_turns: 2, exit_cmd: "python3 scripts/xp_gate.py check", on_fail: "abort", timeout: 5}

  hotfix:
    description: "Correção crítica urgente em produção com patch pontual"
    nodes:
      - {name: "test_red", run: "builder", kind: "model", skills: ["tdd-safety-net"], soft_turns: 5, exit_cmd: "! {verify_cmd}", on_fail: "retry", timeout: 10, freeze_tests: true}
      - {name: "patch_green", run: "builder", kind: "model", skills: ["tdd-safety-net"], soft_turns: 5, exit_cmd: "{verify_cmd}", on_fail: "retry", timeout: 15}
      - {name: "gate", run: "reviewer", kind: "code", skills: ["code-hygiene-review"], soft_turns: 2, exit_cmd: "python3 scripts/xp_gate.py check", on_fail: "abort", timeout: 5}

  release:
    description: "Auditoria final e liberação de entrega com conformidade"
    nodes:
      - {name: "full_suite", run: "shipper", kind: "code", skills: ["release-and-deploy"], soft_turns: 5, exit_cmd: "{verify_cmd}", on_fail: "abort", timeout: 10}
      - {name: "gate", run: "reviewer", kind: "code", skills: ["code-hygiene-review"], soft_turns: 2, exit_cmd: "python3 scripts/xp_gate.py check", on_fail: "abort", timeout: 5}

  migration:
    description: "Migração de esquema de banco de dados expand-and-contract"
    nodes:
      - {name: "approve_spec", run: "sentinel", kind: "model", skills: ["database-architecture"], soft_turns: 3, exit_cmd: "test -f .agents/runtime/run.json", timeout: 5}
      - {name: "expand_schema", run: "builder", kind: "model", skills: ["database-architecture"], soft_turns: 5, exit_cmd: "{verify_cmd}", on_fail: "retry", timeout: 15}
      - {name: "contract_schema", run: "builder", kind: "model", skills: ["database-architecture"], soft_turns: 5, exit_cmd: "{verify_cmd}", on_fail: "retry", timeout: 15}
      - {name: "gate", run: "reviewer", kind: "code", skills: [], soft_turns: 2, exit_cmd: "python3 scripts/xp_gate.py check", on_fail: "abort", timeout: 5}

  incident:
    description: "Mitigação emergencial de incidente e registro de lição"
    nodes:
      - {name: "mitigate", run: "shipper", kind: "model", skills: ["ci-auto-heal"], soft_turns: 5, exit_cmd: "test -f .agents/runtime/run.json", on_fail: "retry", timeout: 10}
      - {name: "post_mortem", run: "code", kind: "code", skills: ["project-memory"], soft_turns: 3, exit_cmd: "test -f .agents/memory/PROJECT_MEMORY.md", on_fail: "retry", timeout: 10}
      - {name: "gate", run: "reviewer", kind: "code", skills: [], soft_turns: 2, exit_cmd: "python3 scripts/xp_gate.py check", on_fail: "abort", timeout: 5}

  design:
    description: "Design de interfaces, tokens visuais e acessibilidade"
    nodes:
      - {name: "mockup", run: "designer", kind: "model", skills: ["frontend-taste-engineering", "design-system"], soft_turns: 5, exit_cmd: "python3 scripts/xp contract validate", on_fail: "retry", timeout: 15}
      - {name: "gate", run: "reviewer", kind: "code", skills: ["ui-quality-gate"], soft_turns: 2, exit_cmd: "python3 scripts/xp_gate.py check", on_fail: "abort", timeout: 5}
