  - id: "api-contracts"
    kind: "skill"
    prevents: "API breaking changes and unversioned endpoint contracts"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "async-messaging-and-resilience"
    kind: "skill"
    prevents: "Lost messages, unbounded retries, and cascading failures in distributed workflows"
