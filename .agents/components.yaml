# .agents/components.yaml — Ledger de Componentes e Garantias de Remoção (P7)
# Regra: todo componente entra aqui com a falha que previne.
# Se a falha não ocorre em N sessões, o componente paga aluguel ou é removido.

version: "4.0.0"

components:
  # Scripts nucleares
  - id: "xp_contract"
    kind: "script"
    prevents: "Ambiguous task scope, lost constraints across iterations, and loop amnesia"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "policy_yaml"
    kind: "policy"
    prevents: "Unauthenticated destructive commands (drop, rm, tf, publish) executed without human approval"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "pre_tool_guard"
    kind: "hook"
    prevents: "Agent forging approvals or modifying policies to bypass human safety gates"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "xp_gate"
    kind: "script"
    prevents: "Shipping broken, untested code, stubs (TODO/as any), or regressions based on verbal claims"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "kit_events"
    kind: "script"
    prevents: "Silent repetitive failures and token waste without circuit breaker intervention"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "xp_cli"
    kind: "script"
    prevents: "CLI fragmentation and conflicting entrypoints (xp-* vs agy-*)"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "workflow_yaml"
    kind: "workflow"
    prevents: "Undefined multi-step lifecycle transitions and unstructured execution drift"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "xp_flow"
    kind: "script"
    prevents: "Arbitrary bypassing of RED test phases and untested code progression without exit criteria"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "xp_evolve"
    kind: "script"
    prevents: "Stale, unused components lingering in the kit and unaddressed recurring failure patterns"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "xp_session"
    kind: "script"
    prevents: "Fragmented session compaction, resume failures, and untracked handoff contracts"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "xp_eval"
    kind: "script"
    prevents: "Unmeasured performance regressions and token efficiency degradation without benchmark evidence"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "kit_lint"
    kind: "script"
    prevents: "Silent configuration errors, broken schemas, and governance rule violations"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "kit_installer"
    kind: "script"
    prevents: "Broken installation symlinks, conflicting paths, and environment mismatch"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "memory_archiver"
    kind: "script"
    prevents: "Project memory exploding past token limits and lost historical logs"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "evidence_recorder"
    kind: "script"
    prevents: "Unverifiable test outputs, lost execution logs, and turn bloat"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "conformance_report"
    kind: "script"
    prevents: "Unverified acceptance criteria and undocumented feature coverage"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "goldfish_review"
    kind: "script"
    prevents: "Self-serving review bias and uncritical acceptance of architectural drift"
    added: "2026-11-01"
    review_by: "2027-02-01"

  # Hooks
  - id: "tool_size_guard"
    kind: "hook"
    prevents: "Massive tool output floods consuming agent context window"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "smart_tool_optimizer"
    kind: "hook"
    prevents: "Repetitive file reads, redundant directory scans, and token waste"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "smart_tool_optimizer_state"
    kind: "hook"
    prevents: "Repetitive file reads and blind re-reads after edits"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "smart_tool_optimizer_view"
    kind: "hook"
    prevents: "Blind file slicing beyond the single-read budget"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "smart_tool_optimizer_command"
    kind: "hook"
    prevents: "Verbose command output flooding the agent context window"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "smart_tool_optimizer_loop"
    kind: "hook"
    prevents: "Repetitive identical tool calls in a loop"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "smart_tool_optimizer_dir_grep_write"
    kind: "hook"
    prevents: "Uncontrolled root directory scans and oversized file writes"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "dynamic_effort_hook"
    kind: "hook"
    prevents: "Over-allocating high reasoning tokens to trivial tasks or under-allocating to critical tasks"
    added: "2026-11-01"
    review_by: "2027-02-01"

  # Agentes
  - id: "builder"
    kind: "agent"
    prevents: "Incomplete implementation, lingering TODOs, and God files"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "designer"
    kind: "agent"
    prevents: "Aesthetically uninspired, inaccessible, and sloppy user interfaces"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "orchestrator"
    kind: "agent"
    prevents: "Misrouted tasks, unclassified risk levels, and unstructured execution"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "reviewer"
    kind: "agent"
    prevents: "Merged code regressions, bypassed gates, and unverified diffs"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "sentinel"
    kind: "agent"
    prevents: "Security vulnerabilities, unauthorized actions, and leaked credentials"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "shipper"
    kind: "agent"
    prevents: "Unverified production releases and catastrophic deployment downtime"
    added: "2026-11-01"
    review_by: "2027-02-01"

  # Políticas
  - id: "architecture-and-persistence"
    kind: "policy"
    prevents: "Unbounded coupling, unindexed database migrations, and architectural drift"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "frontend-and-design-system"
    kind: "policy"
    prevents: "Token duplication, non-standard styling, and inconsistent design components"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "memory-and-context"
    kind: "policy"
    prevents: "Context budget overflow and untracked project decisions"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "release-and-deployment"
    kind: "policy"
    prevents: "Downtime deployments, missing gate checks, and unversioned releases"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "security-and-zero-trust"
    kind: "policy"
    prevents: "Unapproved destructive actions and unauthorized credential access"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "testing-and-quality"
    kind: "policy"
    prevents: "Test bypass, skipped assertions, and untested code releases"
    added: "2026-11-01"
    review_by: "2027-02-01"

  - id: "token-economy"
    kind: "policy"
    prevents: "Context budget explosion and excessive token consumption per turn"
    added: "2026-11-01"
    review_by: "2027-02-01"

